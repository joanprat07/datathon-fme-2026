* { box-sizing: border-box; }
html, body { margin: 0; padding: 0 2px; background: var(--bg); color: #fff; font-family: Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.mono { font-family: &quot;Roboto Mono&quot;, monospace; }
.dim { color: var(--g400); }

.red { color: var(--red); }

/* toolbar: [ label ] ......... controls */
.bar { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 14px;
  font-family: &quot;Roboto Mono&quot;, monospace; font-size: 13px; color: var(--g300); }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--green); }

  box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }

@keyframes pulse { 50% { opacity: .3; } }
.ctrl { display: flex; gap: 0; border: 1px solid var(--g800); }
.ctrl button { background: transparent; color: var(--g300); border: 0; font: 13px &quot;Roboto Mono&quot;, monospace;
  padding: 6px 12px; cursor: pointer; }
.ctrl button + button { border-left: 1px solid var(--g800); }
.ctrl button:hover { color: #fff; }
.ctrl button.on { background: var(--green); color: var(--bg); }

.panel { border: 1px solid var(--g800); background: var(--bg); position: relative; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--g800); }
.stat { padding: 18px 20px; }

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;h2 class=&quot;sec&quot;&gt;How pandabuy chooses ten products&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;For every request: &lt;b&gt;pre-select up to 300&lt;/b&gt; of the ~5,000 products, &lt;b&gt;score&lt;/b&gt; each one, answer the &lt;b&gt;10 highest&lt;/b&gt; in order.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;a(user, product) = &lt;span class=&quot;g&quot;&gt;P(click | examined)&lt;/span&gt; · &lt;span class=&quot;v&quot;&gt;P(purchase | click)&lt;/span&gt;
  &amp;nbsp;&lt;span class=&quot;d&quot;&gt;= P(purchase | examined)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;gap&quot; style=&quot;height:16px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;stats&quot; id=&quot;challenge&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;gap&quot; style=&quot;height:16px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;panel diagram&quot;&gt;
  &lt;div class=&quot;panel-h&quot;&gt;&lt;span&gt;&lt;b&gt;One request, end to end&lt;/b&gt;&lt;/span&gt;&lt;span&gt;~1 ms of compute · answered in ~0.4 s&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;body&quot; id=&quot;figB&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;gap&quot; style=&quot;height:16px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;panel diagram&quot;&gt;
  &lt;div class=&quot;panel-h&quot;&gt;&lt;span&gt;&lt;b&gt;What we read vs. what we learn&lt;/b&gt;&lt;/span&gt;&lt;span&gt;data → state → model&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;body&quot; id=&quot;figA&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;lane-key&quot;&gt;
    &lt;span&gt;&lt;i style=&quot;border-color:#8fb0ff;background:#3d6fff22&quot;&gt;&lt;/i&gt;Data: RawTree tables&lt;/span&gt;
    &lt;span&gt;&lt;i style=&quot;border-color:#8d8d8d;background:#151515&quot;&gt;&lt;/i&gt;State: counters computed from the data&lt;/span&gt;
    &lt;span&gt;&lt;i style=&quot;border-color:#27f795;background:#27f79522&quot;&gt;&lt;/i&gt;Model: weights learned from clicks and purchases&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;gap&quot; style=&quot;height:16px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;stats&quot; id=&quot;valid&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;src&quot; id=&quot;valid-src&quot;&gt;&lt;/div&gt;

&lt;script&gt;
// Small SVG chart helpers in the page style (no external libraries).
// Every function returns an SVG string; widths are viewBox units, so charts scale with their box.
const COL = { green: &quot;#27f795&quot;, red: &quot;#ff4f5e&quot;, violet: &quot;#a594ff&quot;, amber: &quot;#f5c84c&quot;, grid: &quot;#262626&quot;,
  axis: &quot;#636679&quot;, text: &quot;#bdbdbd&quot;, dim: &quot;#8d8d8d&quot;, white: &quot;#ffffff&quot; };
const MONO = &#x27;font-family=&quot;Roboto Mono, monospace&quot;&#x27;;

function esc(s) { return String(s).replace(/&amp;/g, &quot;&amp;amp;&quot;).replace(/&lt;/g, &quot;&amp;lt;&quot;); }
function niceStep(range, n) {
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p &gt;= raw) return m * p;
  return 10 * p;
}
function ticks(max, n = 4) { const s = niceStep(max, n), out = []; for (let v = 0; v &lt;= max + 1e-9; v += s) out.push(+v.toFixed(6)); return out; }
function text(x, y, s, o = {}) {
  return `&lt;text x=&quot;${x}&quot; y=&quot;${y}&quot; ${MONO} font-size=&quot;${o.size || 11}&quot; fill=&quot;${o.fill || COL.axis}&quot; text-anchor=&quot;${o.anchor || &quot;start&quot;}&quot;${o.weight ? ` font-weight=&quot;${o.weight}&quot;` : &quot;&quot;}&gt;${esc(s)}&lt;/text&gt;`;
}
function svg(w, h, body) { return `&lt;svg viewBox=&quot;0 0 ${w} ${h}&quot; width=&quot;100%&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; role=&quot;img&quot;&gt;${body}&lt;/svg&gt;`; }

// Vertical grouped bars. series: [{name, color, values}], labels: x labels.
function bars({ labels, series, w = 560, h = 260, fmt = v =&gt; v, yMax, highlight = -1, valueLabels = true }) {
  const L = 44, R = 10, T = 16, B = 30, iw = w - L - R, ih = h - T - B;
  const max = yMax || Math.max(...series.flatMap(s =&gt; s.values)) * 1.15;
  const tk = ticks(max), top = tk[tk.length - 1], Y = v =&gt; T + ih - (v / top) * ih;
  let g = &quot;&quot;;
  tk.forEach(v =&gt; { g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${w - R}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, fmt(v), { anchor: &quot;end&quot; }); });
  const bw = iw / labels.length, gap = bw * 0.22, sw = (bw - gap) / series.length;
  labels.forEach((lab, i) =&gt; {
    series.forEach((s, j) =&gt; {
      const v = s.values[i], x = L + i * bw + gap / 2 + j * sw, y = Y(v);
      const op = highlight &lt; 0 || highlight === i ? 1 : 0.45;
      g += `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${sw - 2}&quot; height=&quot;${T + ih - y}&quot; fill=&quot;${s.color}&quot; opacity=&quot;${op}&quot;/&gt;`;
      if (valueLabels &amp;&amp; series.length === 1) g += text(x + (sw - 2) / 2, y - 5, fmt(v), { anchor: &quot;middle&quot;, fill: COL.text, size: 10 });
    });
    g += text(L + i * bw + bw / 2, h - 10, lab, { anchor: &quot;middle&quot; });
  });
  return svg(w, h, g);
}

// Lines on a shared x. series: [{name, color, values, dash}]
function lines({ xs, series, w = 560, h = 260, fmt = v =&gt; v, xfmt = v =&gt; v, yMax, yMin = 0, area = false, dots = true, endLabels = true }) {
  const L = 44, R = 70, T = 16, B = 30, iw = w - L - R, ih = h - T - B;
  const max = yMax || Math.max(...series.flatMap(s =&gt; s.values)) * 1.1;
  const tk = ticks(max - yMin).map(v =&gt; v + yMin), top = tk[tk.length - 1];
  const X = i =&gt; L + (i / (xs.length - 1)) * iw, Y = v =&gt; T + ih - ((v - yMin) / (top - yMin)) * ih;
  let g = &quot;&quot;;
  tk.forEach(v =&gt; { g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${L + iw}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, fmt(v), { anchor: &quot;end&quot; }); });
  const every = Math.ceil(xs.length / 12);
  xs.forEach((x, i) =&gt; { if (i % every === 0 || (i === xs.length - 1 &amp;&amp; i % every &gt; every / 2)) g += text(X(i), h - 10, xfmt(x), { anchor: &quot;middle&quot; }); });
  series.forEach(s =&gt; {
    const pts = s.values.map((v, i) =&gt; `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if (area) g += `&lt;polygon points=&quot;${X(0)},${Y(yMin)} ${pts.join(&quot; &quot;)} ${X(xs.length - 1)},${Y(yMin)}&quot; fill=&quot;${s.color}&quot; opacity=&quot;0.12&quot;/&gt;`;
    g += `&lt;polyline points=&quot;${pts.join(&quot; &quot;)}&quot; fill=&quot;none&quot; stroke=&quot;${s.color}&quot; stroke-width=&quot;2&quot;${s.dash ? ` stroke-dasharray=&quot;${s.dash}&quot;` : &quot;&quot;}/&gt;`;
    if (dots) s.values.forEach((v, i) =&gt; { g += `&lt;circle cx=&quot;${X(i)}&quot; cy=&quot;${Y(v)}&quot; r=&quot;2.6&quot; fill=&quot;${s.color}&quot;/&gt;`; });
    const last = s.values.length - 1;
    if (endLabels) g += text(X(last) + 8, Y(s.values[last]) + 4, s.name, { fill: s.color, size: 10 });
  });
  return svg(w, h, g);
}

// Horizontal box plots. rows: [{label, box: [p5, q1, med, q3, p95], note}]; log x scale.
function boxes({ rows, w = 560, h, ticksAt = [2, 5, 10, 20, 50, 100, 200], fmt = v =&gt; v, color = COL.green, lo, hi }) {
  const L = 150, R = 56, T = 10, rowH = 30, B = 28; h = h || T + rows.length * rowH + B;
  lo = lo || Math.min(...rows.map(r =&gt; r.box[0])) * 0.8; hi = hi || Math.max(...rows.map(r =&gt; r.box[4])) * 1.1;
  const iw = w - L - R, X = v =&gt; L + (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * iw;
  let g = &quot;&quot;;
  ticksAt.filter(t =&gt; t &gt;= lo &amp;&amp; t &lt;= hi).forEach(t =&gt; {
    g += `&lt;line x1=&quot;${X(t)}&quot; x2=&quot;${X(t)}&quot; y1=&quot;${T}&quot; y2=&quot;${h - B + 4}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(X(t), h - 8, fmt(t), { anchor: &quot;middle&quot; });
  });
  rows.forEach((r, i) =&gt; {
    const [a, q1, m, q3, b] = r.box, cy = T + i * rowH + rowH / 2;
    g += text(L - 12, cy + 4, r.label, { anchor: &quot;end&quot;, fill: COL.text });
    g += `&lt;line x1=&quot;${X(a)}&quot; x2=&quot;${X(b)}&quot; y1=&quot;${cy}&quot; y2=&quot;${cy}&quot; stroke=&quot;${COL.dim}&quot;/&gt;`;
    g += `&lt;line x1=&quot;${X(a)}&quot; x2=&quot;${X(a)}&quot; y1=&quot;${cy - 5}&quot; y2=&quot;${cy + 5}&quot; stroke=&quot;${COL.dim}&quot;/&gt;&lt;line x1=&quot;${X(b)}&quot; x2=&quot;${X(b)}&quot; y1=&quot;${cy - 5}&quot; y2=&quot;${cy + 5}&quot; stroke=&quot;${COL.dim}&quot;/&gt;`;
    g += `&lt;rect x=&quot;${X(q1)}&quot; y=&quot;${cy - 9}&quot; width=&quot;${X(q3) - X(q1)}&quot; height=&quot;18&quot; fill=&quot;${color}&quot; fill-opacity=&quot;0.16&quot; stroke=&quot;${color}&quot;/&gt;`;
    g += `&lt;line x1=&quot;${X(m)}&quot; x2=&quot;${X(m)}&quot; y1=&quot;${cy - 9}&quot; y2=&quot;${cy + 9}&quot; stroke=&quot;${COL.white}&quot; stroke-width=&quot;2&quot;/&gt;`;
    if (r.note) g += text(w - R + 8, cy + 4, r.note, { size: 10 });
  });
  return svg(w, h, g);
}

// Horizontal bars, optionally two-sided (diverging around 0). rows: [{label, values: [..]}]
function hbars({ rows, series, w = 560, fmt = v =&gt; v, rowH = 24, labelW = 160, diverging = false, max }) {
  const L = labelW, R = 56, T = 8, B = diverging ? 26 : 8, h = T + rows.length * rowH + B, iw = w - L - R;
  max = max || Math.max(...rows.flatMap(r =&gt; r.values.map(Math.abs))) * 1.05;
  const X0 = diverging ? L + iw / 2 : L, S = diverging ? iw / 2 / max : iw / max;
  let g = &quot;&quot;;
  if (diverging) {
    g += `&lt;line x1=&quot;${X0}&quot; x2=&quot;${X0}&quot; y1=&quot;${T}&quot; y2=&quot;${h - B}&quot; stroke=&quot;${COL.axis}&quot;/&gt;`;
    [-max, -max / 2, max / 2, max].forEach(v =&gt; { g += text(X0 + v * S, h - 8, (v &gt; 0 ? &quot;+&quot; : &quot;&quot;) + fmt(v), { anchor: &quot;middle&quot; }); });
  }
  const sh = (rowH - 6) / series.length;
  rows.forEach((r, i) =&gt; {
    const y = T + i * rowH;
    g += text(L - 10, y + rowH / 2 + 4, r.label, { anchor: &quot;end&quot;, fill: COL.text });
    r.values.forEach((v, j) =&gt; {
      const x = v &gt;= 0 ? X0 : X0 + v * S;
      g += `&lt;rect x=&quot;${x}&quot; y=&quot;${y + 3 + j * sh}&quot; width=&quot;${Math.max(1, Math.abs(v) * S)}&quot; height=&quot;${sh - 1}&quot; fill=&quot;${series[j].color}&quot;/&gt;`;
      if (!diverging) g += text(X0 + v * S + 6, y + 3 + j * sh + sh / 2 + 4, fmt(v), { fill: COL.text, size: 10 });
    });
  });
  return svg(w, h, g);
}

// Concentration curve: share of purchases (y) held by the top x% of products.
function lorenz({ values, w = 560, h = 260, mark = 10 }) {
  const L = 44, R = 16, T = 14, B = 30, iw = w - L - R, ih = h - T - B;
  const X = f =&gt; L + f * iw, Y = f =&gt; T + ih - f * ih;
  let g = &quot;&quot;;
  [0, .25, .5, .75, 1].forEach(v =&gt; {
    g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${L + iw}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, (v * 100) + &quot;%&quot;, { anchor: &quot;end&quot; });
    g += text(X(v), h - 10, (v * 100) + &quot;%&quot;, { anchor: &quot;middle&quot; });
  });
  g += `&lt;line x1=&quot;${X(0)}&quot; y1=&quot;${Y(0)}&quot; x2=&quot;${X(1)}&quot; y2=&quot;${Y(1)}&quot; stroke=&quot;${COL.axis}&quot; stroke-dasharray=&quot;4 4&quot;/&gt;`;
  const pts = [[0, 0], ...values.map((v, i) =&gt; [(i + 1) / values.length, v])];
  g += `&lt;polygon points=&quot;${pts.map(p =&gt; `${X(p[0])},${Y(p[1])}`).join(&quot; &quot;)} ${X(1)},${Y(0)}&quot; fill=&quot;${COL.green}&quot; opacity=&quot;0.12&quot;/&gt;`;
  g += `&lt;polyline points=&quot;${pts.map(p =&gt; `${X(p[0])},${Y(p[1])}`).join(&quot; &quot;)}&quot; fill=&quot;none&quot; stroke=&quot;${COL.green}&quot; stroke-width=&quot;2&quot;/&gt;`;
  const v = values[mark - 1];
  g += `&lt;line x1=&quot;${X(mark / 100)}&quot; x2=&quot;${X(mark / 100)}&quot; y1=&quot;${Y(0)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.white}&quot; stroke-dasharray=&quot;2 3&quot;/&gt;`;
  g += `&lt;circle cx=&quot;${X(mark / 100)}&quot; cy=&quot;${Y(v)}&quot; r=&quot;4&quot; fill=&quot;${COL.white}&quot;/&gt;`;
  g += text(X(mark / 100) + 10, Y(v) + 14, `top ${mark}% of products = ${(v * 100).toFixed(0)}% of purchases`, { fill: COL.white, size: 11 });
  g += text(X(0.5), Y(0.5) + 18, &quot;all products equal&quot;, { fill: COL.axis, size: 10 });
  return svg(w, h, g);
}

function legend(items) {
  return `&lt;div class=&quot;legend&quot;&gt;${items.map(([c, n, dash]) =&gt; `&lt;span&gt;&lt;i style=&quot;background:${dash ? &quot;transparent&quot; : c};${dash ? `border-top:2px dashed ${c};` : &quot;&quot;}&quot;&gt;&lt;/i&gt;${n}&lt;/span&gt;`).join(&quot;&quot;)}&lt;/div&gt;`;

&lt;h2 class=&quot;sec&quot;&gt;RawTree: our database and our compute engine&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Everything pandabuy knows comes from RawTree, and every answer goes back to it.&lt;/p&gt;
&lt;div class=&quot;g3&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[01] aggregate&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;≈12 M &lt;small&gt;events&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;aggregated &lt;b&gt;inside RawTree&lt;/b&gt; with SQL (decayed counters, co-visits, profiles). We download only &lt;b id=&quot;agg&quot;&gt;&lt;/b&gt; of results.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[02] tail&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;0.3 &lt;small&gt;s&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;between incremental reads of the live stream: only rows newer than the last seen, duplicates dropped in memory.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[03] write&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;1 &lt;small&gt;insert / cycle&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;all the answers of a cycle in &lt;b&gt;one batched insert&lt;/b&gt; to &lt;code&gt;team_28.submissions&lt;/code&gt;, retried on failure.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2 class=&quot;sec&quot;&gt;Tables we use&lt;/h2&gt;
&lt;div class=&quot;stats&quot; id=&quot;rates&quot; style=&quot;margin-bottom:16px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
  &lt;table class=&quot;t&quot;&gt;
    &lt;tr&gt;&lt;th&gt;table&lt;/th&gt;&lt;th&gt;access&lt;/th&gt;&lt;th&gt;what we take from it&lt;/th&gt;&lt;th&gt;when&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.catalog&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read&lt;/span&gt;&lt;/td&gt;&lt;td&gt;category, subcategory, brand, price of every product&lt;/td&gt;&lt;td&gt;startup&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.catalog_updates&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read · tail&lt;/span&gt;&lt;/td&gt;&lt;td&gt;price changes, out of / back in stock, new products (&lt;span id=&quot;upd&quot;&gt;&lt;/span&gt;)&lt;/td&gt;&lt;td&gt;startup + every 0.3 s&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.history_events&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read · SQL&lt;/span&gt;&lt;/td&gt;&lt;td&gt;≈12 M views, carts, purchases → decayed counters, co-visits, profiles&lt;/td&gt;&lt;td&gt;snapshot&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.history_sessions&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read · SQL&lt;/span&gt;&lt;/td&gt;&lt;td&gt;≈2 M old carousels (shown, propensity, click, purchase) → training rows&lt;/td&gt;&lt;td&gt;training&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.events&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read · tail&lt;/span&gt;&lt;/td&gt;&lt;td&gt;live views, carts, purchases → counters and profiles in memory&lt;/td&gt;&lt;td&gt;every 0.3 s&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;shop.requests&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill r&quot;&gt;read · tail&lt;/span&gt;&lt;/td&gt;&lt;td&gt;the shoppers we must answer&lt;/td&gt;&lt;td&gt;every 0.3 s&lt;/td&gt;&lt;/tr&gt;

  &lt;/table&gt;

&lt;h2 class=&quot;sec&quot;&gt;What we learned about RawTree&lt;/h2&gt;
&lt;div class=&quot;g4&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[types]&lt;/div&gt;&lt;h3&gt;Cast Dynamic columns&lt;/h3&gt;
    &lt;p&gt;Keys of joins, &lt;code&gt;argMax&lt;/code&gt; and some aggregates need explicit casts: &lt;code&gt;product_id::String&lt;/code&gt;, &lt;code&gt;ts::DateTime64(3)&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[connections]&lt;/div&gt;&lt;h3&gt;Few at a time&lt;/h3&gt;
    &lt;p&gt;Beyond ~5 parallel connections new ones are refused, so the builds use 2 workers and the service only two connections.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[size]&lt;/div&gt;&lt;h3&gt;Split big results&lt;/h3&gt;
    &lt;p&gt;Results are capped at 100 MiB: large aggregates are fetched in hash parts and concatenated.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;num&quot;&gt;[nulls]&lt;/div&gt;&lt;h3&gt;Empty is not null&lt;/h3&gt;
    &lt;p&gt;In the history &lt;code&gt;clicked&lt;/code&gt; is null, in our feedback it is &lt;code&gt;&quot;&quot;&lt;/code&gt;: we normalise with &lt;code&gt;ifNull(clicked::String, &#x27;&#x27;)&lt;/code&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// Small SVG chart helpers in the page style (no external libraries).
// Every function returns an SVG string; widths are viewBox units, so charts scale with their box.
const COL = { green: &quot;#27f795&quot;, red: &quot;#ff4f5e&quot;, violet: &quot;#a594ff&quot;, amber: &quot;#f5c84c&quot;, grid: &quot;#262626&quot;,
  axis: &quot;#636679&quot;, text: &quot;#bdbdbd&quot;, dim: &quot;#8d8d8d&quot;, white: &quot;#ffffff&quot; };
const MONO = &#x27;font-family=&quot;Roboto Mono, monospace&quot;&#x27;;

function esc(s) { return String(s).replace(/&amp;/g, &quot;&amp;amp;&quot;).replace(/&lt;/g, &quot;&amp;lt;&quot;); }
function niceStep(range, n) {
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p &gt;= raw) return m * p;
  return 10 * p;
}
function ticks(max, n = 4) { const s = niceStep(max, n), out = []; for (let v = 0; v &lt;= max + 1e-9; v += s) out.push(+v.toFixed(6)); return out; }
function text(x, y, s, o = {}) {
  return `&lt;text x=&quot;${x}&quot; y=&quot;${y}&quot; ${MONO} font-size=&quot;${o.size || 11}&quot; fill=&quot;${o.fill || COL.axis}&quot; text-anchor=&quot;${o.anchor || &quot;start&quot;}&quot;${o.weight ? ` font-weight=&quot;${o.weight}&quot;` : &quot;&quot;}&gt;${esc(s)}&lt;/text&gt;`;
}
function svg(w, h, body) { return `&lt;svg viewBox=&quot;0 0 ${w} ${h}&quot; width=&quot;100%&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; role=&quot;img&quot;&gt;${body}&lt;/svg&gt;`; }

// Vertical grouped bars. series: [{name, color, values}], labels: x labels.
function bars({ labels, series, w = 560, h = 260, fmt = v =&gt; v, yMax, highlight = -1, valueLabels = true }) {
  const L = 44, R = 10, T = 16, B = 30, iw = w - L - R, ih = h - T - B;
  const max = yMax || Math.max(...series.flatMap(s =&gt; s.values)) * 1.15;
  const tk = ticks(max), top = tk[tk.length - 1], Y = v =&gt; T + ih - (v / top) * ih;
  let g = &quot;&quot;;
  tk.forEach(v =&gt; { g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${w - R}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, fmt(v), { anchor: &quot;end&quot; }); });
  const bw = iw / labels.length, gap = bw * 0.22, sw = (bw - gap) / series.length;
  labels.forEach((lab, i) =&gt; {
    series.forEach((s, j) =&gt; {
      const v = s.values[i], x = L + i * bw + gap / 2 + j * sw, y = Y(v);
      const op = highlight &lt; 0 || highlight === i ? 1 : 0.45;
      g += `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${sw - 2}&quot; height=&quot;${T + ih - y}&quot; fill=&quot;${s.color}&quot; opacity=&quot;${op}&quot;/&gt;`;
      if (valueLabels &amp;&amp; series.length === 1) g += text(x + (sw - 2) / 2, y - 5, fmt(v), { anchor: &quot;middle&quot;, fill: COL.text, size: 10 });
    });
    g += text(L + i * bw + bw / 2, h - 10, lab, { anchor: &quot;middle&quot; });
  });
  return svg(w, h, g);
}

// Lines on a shared x. series: [{name, color, values, dash}]
function lines({ xs, series, w = 560, h = 260, fmt = v =&gt; v, xfmt = v =&gt; v, yMax, yMin = 0, area = false, dots = true, endLabels = true }) {
  const L = 44, R = 70, T = 16, B = 30, iw = w - L - R, ih = h - T - B;
  const max = yMax || Math.max(...series.flatMap(s =&gt; s.values)) * 1.1;
  const tk = ticks(max - yMin).map(v =&gt; v + yMin), top = tk[tk.length - 1];
  const X = i =&gt; L + (i / (xs.length - 1)) * iw, Y = v =&gt; T + ih - ((v - yMin) / (top - yMin)) * ih;
  let g = &quot;&quot;;
  tk.forEach(v =&gt; { g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${L + iw}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, fmt(v), { anchor: &quot;end&quot; }); });
  const every = Math.ceil(xs.length / 12);
  xs.forEach((x, i) =&gt; { if (i % every === 0 || (i === xs.length - 1 &amp;&amp; i % every &gt; every / 2)) g += text(X(i), h - 10, xfmt(x), { anchor: &quot;middle&quot; }); });
  series.forEach(s =&gt; {
    const pts = s.values.map((v, i) =&gt; `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if (area) g += `&lt;polygon points=&quot;${X(0)},${Y(yMin)} ${pts.join(&quot; &quot;)} ${X(xs.length - 1)},${Y(yMin)}&quot; fill=&quot;${s.color}&quot; opacity=&quot;0.12&quot;/&gt;`;
    g += `&lt;polyline points=&quot;${pts.join(&quot; &quot;)}&quot; fill=&quot;none&quot; stroke=&quot;${s.color}&quot; stroke-width=&quot;2&quot;${s.dash ? ` stroke-dasharray=&quot;${s.dash}&quot;` : &quot;&quot;}/&gt;`;
    if (dots) s.values.forEach((v, i) =&gt; { g += `&lt;circle cx=&quot;${X(i)}&quot; cy=&quot;${Y(v)}&quot; r=&quot;2.6&quot; fill=&quot;${s.color}&quot;/&gt;`; });
    const last = s.values.length - 1;
    if (endLabels) g += text(X(last) + 8, Y(s.values[last]) + 4, s.name, { fill: s.color, size: 10 });
  });
  return svg(w, h, g);
}

// Horizontal box plots. rows: [{label, box: [p5, q1, med, q3, p95], note}]; log x scale.
function boxes({ rows, w = 560, h, ticksAt = [2, 5, 10, 20, 50, 100, 200], fmt = v =&gt; v, color = COL.green, lo, hi }) {
  const L = 150, R = 56, T = 10, rowH = 30, B = 28; h = h || T + rows.length * rowH + B;
  lo = lo || Math.min(...rows.map(r =&gt; r.box[0])) * 0.8; hi = hi || Math.max(...rows.map(r =&gt; r.box[4])) * 1.1;
  const iw = w - L - R, X = v =&gt; L + (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * iw;
  let g = &quot;&quot;;
  ticksAt.filter(t =&gt; t &gt;= lo &amp;&amp; t &lt;= hi).forEach(t =&gt; {
    g += `&lt;line x1=&quot;${X(t)}&quot; x2=&quot;${X(t)}&quot; y1=&quot;${T}&quot; y2=&quot;${h - B + 4}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(X(t), h - 8, fmt(t), { anchor: &quot;middle&quot; });
  });
  rows.forEach((r, i) =&gt; {
    const [a, q1, m, q3, b] = r.box, cy = T + i * rowH + rowH / 2;
    g += text(L - 12, cy + 4, r.label, { anchor: &quot;end&quot;, fill: COL.text });
    g += `&lt;line x1=&quot;${X(a)}&quot; x2=&quot;${X(b)}&quot; y1=&quot;${cy}&quot; y2=&quot;${cy}&quot; stroke=&quot;${COL.dim}&quot;/&gt;`;
    g += `&lt;line x1=&quot;${X(a)}&quot; x2=&quot;${X(a)}&quot; y1=&quot;${cy - 5}&quot; y2=&quot;${cy + 5}&quot; stroke=&quot;${COL.dim}&quot;/&gt;&lt;line x1=&quot;${X(b)}&quot; x2=&quot;${X(b)}&quot; y1=&quot;${cy - 5}&quot; y2=&quot;${cy + 5}&quot; stroke=&quot;${COL.dim}&quot;/&gt;`;
    g += `&lt;rect x=&quot;${X(q1)}&quot; y=&quot;${cy - 9}&quot; width=&quot;${X(q3) - X(q1)}&quot; height=&quot;18&quot; fill=&quot;${color}&quot; fill-opacity=&quot;0.16&quot; stroke=&quot;${color}&quot;/&gt;`;
    g += `&lt;line x1=&quot;${X(m)}&quot; x2=&quot;${X(m)}&quot; y1=&quot;${cy - 9}&quot; y2=&quot;${cy + 9}&quot; stroke=&quot;${COL.white}&quot; stroke-width=&quot;2&quot;/&gt;`;
    if (r.note) g += text(w - R + 8, cy + 4, r.note, { size: 10 });
  });
  return svg(w, h, g);
}

// Horizontal bars, optionally two-sided (diverging around 0). rows: [{label, values: [..]}]
function hbars({ rows, series, w = 560, fmt = v =&gt; v, rowH = 24, labelW = 160, diverging = false, max }) {
  const L = labelW, R = 56, T = 8, B = diverging ? 26 : 8, h = T + rows.length * rowH + B, iw = w - L - R;
  max = max || Math.max(...rows.flatMap(r =&gt; r.values.map(Math.abs))) * 1.05;
  const X0 = diverging ? L + iw / 2 : L, S = diverging ? iw / 2 / max : iw / max;
  let g = &quot;&quot;;
  if (diverging) {
    g += `&lt;line x1=&quot;${X0}&quot; x2=&quot;${X0}&quot; y1=&quot;${T}&quot; y2=&quot;${h - B}&quot; stroke=&quot;${COL.axis}&quot;/&gt;`;
    [-max, -max / 2, max / 2, max].forEach(v =&gt; { g += text(X0 + v * S, h - 8, (v &gt; 0 ? &quot;+&quot; : &quot;&quot;) + fmt(v), { anchor: &quot;middle&quot; }); });
  }
  const sh = (rowH - 6) / series.length;
  rows.forEach((r, i) =&gt; {
    const y = T + i * rowH;
    g += text(L - 10, y + rowH / 2 + 4, r.label, { anchor: &quot;end&quot;, fill: COL.text });
    r.values.forEach((v, j) =&gt; {
      const x = v &gt;= 0 ? X0 : X0 + v * S;
      g += `&lt;rect x=&quot;${x}&quot; y=&quot;${y + 3 + j * sh}&quot; width=&quot;${Math.max(1, Math.abs(v) * S)}&quot; height=&quot;${sh - 1}&quot; fill=&quot;${series[j].color}&quot;/&gt;`;
      if (!diverging) g += text(X0 + v * S + 6, y + 3 + j * sh + sh / 2 + 4, fmt(v), { fill: COL.text, size: 10 });
    });
  });
  return svg(w, h, g);
}

// Concentration curve: share of purchases (y) held by the top x% of products.
function lorenz({ values, w = 560, h = 260, mark = 10 }) {
  const L = 44, R = 16, T = 14, B = 30, iw = w - L - R, ih = h - T - B;
  const X = f =&gt; L + f * iw, Y = f =&gt; T + ih - f * ih;
  let g = &quot;&quot;;
  [0, .25, .5, .75, 1].forEach(v =&gt; {
    g += `&lt;line x1=&quot;${L}&quot; x2=&quot;${L + iw}&quot; y1=&quot;${Y(v)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.grid}&quot; stroke-dasharray=&quot;2 4&quot;/&gt;` + text(L - 8, Y(v) + 4, (v * 100) + &quot;%&quot;, { anchor: &quot;end&quot; });
    g += text(X(v), h - 10, (v * 100) + &quot;%&quot;, { anchor: &quot;middle&quot; });
  });
  g += `&lt;line x1=&quot;${X(0)}&quot; y1=&quot;${Y(0)}&quot; x2=&quot;${X(1)}&quot; y2=&quot;${Y(1)}&quot; stroke=&quot;${COL.axis}&quot; stroke-dasharray=&quot;4 4&quot;/&gt;`;
  const pts = [[0, 0], ...values.map((v, i) =&gt; [(i + 1) / values.length, v])];
  g += `&lt;polygon points=&quot;${pts.map(p =&gt; `${X(p[0])},${Y(p[1])}`).join(&quot; &quot;)} ${X(1)},${Y(0)}&quot; fill=&quot;${COL.green}&quot; opacity=&quot;0.12&quot;/&gt;`;
  g += `&lt;polyline points=&quot;${pts.map(p =&gt; `${X(p[0])},${Y(p[1])}`).join(&quot; &quot;)}&quot; fill=&quot;none&quot; stroke=&quot;${COL.green}&quot; stroke-width=&quot;2&quot;/&gt;`;
  const v = values[mark - 1];
  g += `&lt;line x1=&quot;${X(mark / 100)}&quot; x2=&quot;${X(mark / 100)}&quot; y1=&quot;${Y(0)}&quot; y2=&quot;${Y(v)}&quot; stroke=&quot;${COL.white}&quot; stroke-dasharray=&quot;2 3&quot;/&gt;`;
  g += `&lt;circle cx=&quot;${X(mark / 100)}&quot; cy=&quot;${Y(v)}&quot; r=&quot;4&quot; fill=&quot;${COL.white}&quot;/&gt;`;
  g += text(X(mark / 100) + 10, Y(v) + 14, `top ${mark}% of products = ${(v * 100).toFixed(0)}% of purchases`, { fill: COL.white, size: 11 });
  g += text(X(0.5), Y(0.5) + 18, &quot;all products equal&quot;, { fill: COL.axis, size: 10 });
  return svg(w, h, g);
}

const BY_SUB = {}; CATALOG.forEach(p =&gt; (BY_SUB[p.sub] = BY_SUB[p.sub] || []).push(p));
const BRANDS = [...new Set(CATALOG.map(p =&gt; p.brand))];
const DEVICES = [&quot;web&quot;, &quot;ios&quot;, &quot;android&quot;];
const BASELINE = [...CATALOG].sort((a, b) =&gt; b.pop - a.pop).slice(0, 10);   // best sellers, same for everyone
const PAGE_F = { home: 0.22, category: 1.0, product: 1.0 };

// Hidden purchase probability of an examined product (the simulator&#x27;s stand-in). K is calibrated below.
let K = 1;
function trueQ(u, p) {
  let aff = 0.35;
  if (u.subs.has(p.sub)) aff = 4.0; else if (u.cats.has(p.cat)) aff = 1.7;
  if (u.brands.has(p.brand)) aff *= 2.2;
  if (u.histSubs.has(p.sub)) aff *= 1.6;
  if (u.viewed.has(p.id)) aff *= 1.6;
  if (u.bought.has(p.id)) aff *= 0.35;
  const fit = Math.exp(-Math.abs(Math.log(p.price / u.budget)) * 0.8);
  return Math.min(0.6, K * PAGE_F[u.page] * (0.25 + p.pop) * aff * (0.35 + fit));
}
function listProb(u, items) { let none = 1; items.forEach((p, k) =&gt; { none *= 1 - EXAM[k] * trueQ(u, p); }); return 1 - none; }

// ---- our recommender -------------------------------------------------------
const exposure = new Map();   // how often each product has been shown (for exploration)

function sourceLists(u, rnd) {
  const jit = () =&gt; Math.exp(0.25 * gauss(rnd));
  const inSession = p =&gt; !u.hasRv || u.cats.has(p.cat);
  const score = (arr, f) =&gt; arr.map(p =&gt; [p, f(p) * jit()]).sort((a, b) =&gt; b[1] - a[1]).map(x =&gt; x[0]);
  const lists = {};
  if (u.hasRv) {
    const last = u.recent[u.recent.length - 1];
    lists.sim = score(CATALOG.filter(inSession), p =&gt; (p.sub === last.sub ? 3 : 0) + (u.cats.has(p.cat) ? 1 : 0)
      + (p.brand === last.brand ? 1.5 : 0) + Math.exp(-Math.abs(Math.log(p.price / last.price))) + 0.03 * p.pop);
    lists.cov = score(CATALOG.filter(p =&gt; u.subs.has(p.sub) || u.cats.has(p.cat)), p =&gt; (u.subs.has(p.sub) ? 2 : 0.6) * (0.2 + p.pop));
    lists.covx = score(CATALOG.filter(p =&gt; !u.cats.has(p.cat)), p =&gt; 0.2 + p.pop);
  }
  if (u.returning) lists.user = score(CATALOG.filter(inSession), p =&gt; (u.histSubs.has(p.sub) ? 1 : 0)
    + (u.brands.has(p.brand) ? 0.5 : 0) + (u.cats.has(p.cat) ? 0.25 : 0) + 0.02 * p.pop);
  lists.trend = score(CATALOG.filter(inSession), p =&gt; p.pop * Math.exp(0.5 * gauss(rnd)));
  lists.pop = score(CATALOG.filter(inSession), p =&gt; p.pop + (u.cats.has(p.cat) ? 0.3 : 0));
  return lists;
}

function recommend(u, rnd) {
  const quota = PARAMS.quotas[`${u.hasRv ? &quot;rv&quot; : &quot;no_rv&quot;}|${u.returning ? &quot;hist&quot; : &quot;no_hist&quot;}`];
  const lists = sourceLists(u, rnd), seen = new Map();
  for (const [src, n] of Object.entries(quota)) {
    let k = 0;
    for (const p of lists[src] || []) { if (k &gt;= n) break; if (!seen.has(p.id)) { seen.set(p.id, { p, src }); k++; } }
  }
  const noise = u.returning ? 0.35 : 0.6;   // a good model, not an oracle; less sure about new shoppers
  const cands = [...seen.values()].map(c =&gt; {
    const q = trueQ(u, c.p) / (u.bought.has(c.p.id) ? 0.35 : 1);         // our model does not know the true effect...
    const prior = u.bought.has(c.p.id) ? Math.exp(PARAMS.bought_prior) : 1; // ...it starts from the bought prior
    return { ...c, a: q * prior * Math.exp(noise * gauss(rnd)) };
  }).sort((x, y) =&gt; y.a - x.a || y.p.price - x.p.price);
  const top = cands.slice(0, 10).map(c =&gt; ({ ...c, explore: false }));
  // exploration: slots 8-10, 5 % each, least-exposed of the next 30
  const pool = cands.slice(10, 40);
  for (const k of [7, 8, 9]) {
    if (rnd() &lt; PARAMS.explore_eps &amp;&amp; pool.length) {
      pool.sort((x, y) =&gt; (exposure.get(x.p.id) || 0) - (exposure.get(y.p.id) || 0));
      top[k] = { ...pool.shift(), explore: true };
    }
  }
  top.forEach(c =&gt; exposure.set(c.p.id, (exposure.get(c.p.id) || 0) + 1));
  return { recs: top, nCand: cands.length };
}

// ---- shopper stream ---------------------------------------------------------
function makeShopper(rnd, n, t) {
  const returning = rnd() &gt; PARAMS.new_share / 100;
  const page = pickW(rnd, PARAMS.pages.map(p =&gt; p.page), PARAMS.pages.map(p =&gt; p.share));
  const hasRv = page !== &quot;home&quot; ? rnd() &lt; PARAMS.rv_share / 100 + 0.1 : rnd() &lt; 0.35;
  const cat1 = pick(rnd, CATS);
  const subs1 = [...new Set(BY_CAT[cat1].map(p =&gt; p.sub))];
  const sub1 = pick(rnd, subs1);
  const recent = [];
  if (hasRv) {
    const nV = 1 + Math.floor(rnd() * 4);
    for (let i = 0; i &lt; nV; i++) recent.push(pick(rnd, rnd() &lt; 0.7 ? BY_SUB[sub1] : BY_CAT[cat1]));
  }
  const brands = new Set(returning ? [pick(rnd, BRANDS), pick(rnd, BRANDS), ...(rnd() &lt; 0.5 ? [pick(rnd, BY_SUB[sub1]).brand] : [])] : []);
  const histSubs = new Set(returning ? [rnd() &lt; 0.6 ? sub1 : pick(rnd, subs1), pick(rnd, CATALOG).sub] : []);
  const bought = new Set(returning &amp;&amp; rnd() &lt; 0.3 ? [pick(rnd, BY_SUB[sub1]).id] : []);
  const ref = recent.length ? recent.reduce((a, p) =&gt; a + Math.log(p.price), 0) / recent.length : Math.log(pick(rnd, BY_CAT[cat1]).price);
  const u = {
    n, ts: new Date(t).toISOString(), request_id: &quot;r_&quot; + hex(rnd, 16), user_id: &quot;u_&quot; + hex(rnd, 8),
    is_new_user: !returning, returning, page, device: pick(rnd, DEVICES),
    region: pickW(rnd, PARAMS.regions.map(r =&gt; r[0]), PARAMS.regions.map(r =&gt; r[1])),
    hasRv, recent, cats: new Set(hasRv ? recent.map(p =&gt; p.cat) : returning ? [cat1] : []),
    subs: new Set(recent.map(p =&gt; p.sub)), viewed: new Set(recent.map(p =&gt; p.id)),
    brands, histSubs, bought, budget: Math.exp(ref + 0.3 * gauss(rnd)),
  };
  if (!hasRv &amp;&amp; !returning) u.cats = new Set();
  return u;
}

// K so that the baseline converts like the real old carousel (target_cvr purchases per request)
(function calibrate() {
  const rnd = mulberry32(7);
  const us = []; for (let i = 0; i &lt; 1500; i++) us.push(makeShopper(rnd, i, 0));
  let lo = 0.0005, hi = 0.2;
  for (let it = 0; it &lt; 30; it++) {
    K = Math.sqrt(lo * hi);
    const m = us.reduce((a, u) =&gt; a + listProb(u, BASELINE), 0) / us.length;
    if (m &gt; PARAMS.target_cvr / 100) hi = K; else lo = K;
  }
})();

function makeStream(seed) {
  const rnd = mulberry32(seed);
  let n = 0, t = Date.parse(&quot;2026-11-15T09:00:00Z&quot;);
  return function next() {
    n += 1; t += Math.round(-Math.log(rnd() + 1e-9) * 1000 / PARAMS.users_per_sec);
    const u = makeShopper(rnd, n, t);
    const { recs, nCand } = recommend(u, rnd);
    u.recs = recs; u.nCand = nCand;
    const ours = recs.map(c =&gt; c.p);
    u.pOurs = listProb(u, ours);
    u.pBase = listProb(u, BASELINE);
    // latency: log-normal around the measured p50 / p95
    u.latency = Math.round(1000 * PARAMS.age_p50 * Math.exp(Math.log(PARAMS.age_p95 / PARAMS.age_p50) / 1.645 * gauss(rnd)));
    // realised outcome for both systems with a common random number (fair comparison)
    const coin = rnd(), r2 = rnd();
    const outcome = (items, prob) =&gt; {
      if (coin &gt;= prob) return null;
      const w = items.map((p, k) =&gt; EXAM[k] * trueQ(u, p));
      return pickW(() =&gt; r2, items, w);
    };
    u.boughtOurs = outcome(ours, u.pOurs);
    u.boughtBase = outcome(BASELINE, u.pBase);
    return u;
  };
}

const fmtEur = v =&gt; v.toLocaleString(&quot;en-US&quot;, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + &quot; €&quot;;


const $ = id =&gt; document.getElementById(id);
const next = makeStream(PARAMS.seed);
const S = { n: 0, revO: 0, revB: 0, buyO: 0, buyB: 0, ptsRev: [[0, 0, 0]], ptsConv: [], win: [], lat: [] };
const WIN = 500, MAX_PTS = 1500, VISIBLE = 7, ROW = 90, SHOW_MS = 3200, OUTCOME_MS = 1250;
let currentRid = null, lastBuyer = null, nShown = 0;
let speed = 1, acc = 0, last = performance.now(), lastShow = 0, latest = null, sinceShow = 0;
let users = [];
const nodes = new Map();
$(&quot;tcvr&quot;).textContent = PARAMS.target_cvr.toFixed(2) + &quot; %&quot;; $(&quot;rps&quot;).textContent = PARAMS.users_per_sec;

// ------------------------------------------------------------------ market (every shopper)
function consume() {
  const u = next();
  S.n += 1; sinceShow += 1;
  if (u.boughtOurs) { S.revO += u.boughtOurs.price; S.buyO += 1; }
  if (u.boughtBase) { S.revB += u.boughtBase.price; S.buyB += 1; }
  S.win.push([u.pOurs, u.pBase]); if (S.win.length &gt; WIN) S.win.shift();
  S.lat.push(u.latency); if (S.lat.length &gt; 2000) S.lat.shift();
  S.ptsRev.push([S.n, S.revO, S.revB]);
  if (S.n &gt;= 50) {
    const a = S.win.reduce((s, w) =&gt; s + w[0], 0) / S.win.length * 100;
    const b = S.win.reduce((s, w) =&gt; s + w[1], 0) / S.win.length * 100;
    S.ptsConv.push([S.n, a, b]);
  }
  for (const k of [&quot;ptsRev&quot;, &quot;ptsConv&quot;]) if (S[k].length &gt; MAX_PTS) S[k] = S[k].filter((_, i) =&gt; i % 2 === 0 || i === S[k].length - 1);
  latest = u;
  if (u.boughtOurs) lastBuyer = u;
}

function niceMax(v) { if (v &lt;= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p &gt;= v) return m * p; return 10 * p; }
function fmtK(v) { return v &gt;= 1000 ? (v / 1000).toFixed(v &gt;= 10000 ? 0 : 1) + &quot;k&quot; : v.toFixed(0); }

function draw(canvas, pts, opts) {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const g = canvas.getContext(&quot;2d&quot;);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 56, R = 92, T = 18, B = 30, w = W - L - R, h = H - T - B;
  const x0 = opts.xFrom ? opts.xFrom(pts) : 0;
  const xmax = Math.max(niceMax(pts.length ? pts[pts.length - 1][0] : 1), 100);
  const ymax = niceMax(Math.max(opts.minY || 1, ...pts.map(p =&gt; Math.max(p[1], p[2]))) * 1.08);
  const X = x =&gt; L + ((x - x0) / (xmax - x0)) * w, Y = y =&gt; T + h - (y / ymax) * h;
  g.font = &#x27;11px &quot;Roboto Mono&quot;, monospace&#x27;; g.fillStyle = &quot;#636679&quot;; g.strokeStyle = &quot;#262626&quot;; g.lineWidth = 1;
  g.setLineDash([2, 4]);
  for (let i = 0; i &lt;= 4; i++) {
    const y = T + (h * i) / 4;
    g.beginPath(); g.moveTo(L, y + .5); g.lineTo(L + w, y + .5); g.stroke();
    g.textAlign = &quot;right&quot;; g.fillText(opts.fmtY(ymax * (1 - i / 4)), L - 10, y + 4);
  }
  g.setLineDash([]); g.textAlign = &quot;center&quot;;
  for (let i = 0; i &lt;= 4; i++) { const xv = x0 + (xmax - x0) * i / 4; g.fillText(fmtK(xv), X(xv), H - 8); }
  if (!pts.length) return;
  const series = [[2, &quot;#ff4f5e&quot;, &quot;rgba(255,79,94,&quot;], [1, &quot;#27f795&quot;, &quot;rgba(39,247,149,&quot;]];
  for (const [k, col, rgba] of series) {
    if (opts.fill) {
      const grad = g.createLinearGradient(0, T, 0, T + h);
      grad.addColorStop(0, rgba + &quot;0.18)&quot;); grad.addColorStop(1, rgba + &quot;0)&quot;);
      g.beginPath(); g.moveTo(X(pts[0][0]), Y(0));
      pts.forEach(p =&gt; g.lineTo(X(p[0]), Y(p[k])));
      g.lineTo(X(pts[pts.length - 1][0]), Y(0)); g.closePath(); g.fillStyle = grad; g.fill();
    }
    g.beginPath(); pts.forEach((p, i) =&gt; i ? g.lineTo(X(p[0]), Y(p[k])) : g.moveTo(X(p[0]), Y(p[k])));
    g.strokeStyle = col; g.lineWidth = 2; g.stroke();
    const p = pts[pts.length - 1], x = X(p[0]), y = Y(p[k]);
    g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fillStyle = col; g.fill();
    g.beginPath(); g.arc(x, y, 8, 0, 7); g.fillStyle = rgba + &quot;0.18)&quot;; g.fill();
    g.fillStyle = col; g.textAlign = &quot;left&quot;; g.font = &#x27;12px &quot;Roboto Mono&quot;, monospace&#x27;;
    g.fillText(opts.fmtY(p[k], true), x + 12, y + 4);
    g.font = &#x27;11px &quot;Roboto Mono&quot;, monospace&#x27;;
  }
}

function render() {
  draw($(&quot;c1&quot;), S.ptsRev, { fill: true, minY: 100, fmtY: (v, head) =&gt; head ? fmtEur(v) : fmtK(v) + &quot; €&quot; });
  $(&quot;s-req&quot;).textContent = S.n.toLocaleString(&quot;en-US&quot;);
  $(&quot;s-ours&quot;).textContent = fmtEur(S.revO);
  $(&quot;s-base&quot;).textContent = fmtEur(S.revB);
  $(&quot;s-up&quot;).textContent = S.revB &gt; 0 ? (S.revO &gt;= S.revB ? &quot;+&quot; : &quot;&quot;) + ((S.revO / S.revB - 1) * 100).toFixed(0) + &quot;%&quot; : &quot;—&quot;;
  $(&quot;s-up&quot;).className = &quot;v &quot; + (S.revO &gt;= S.revB ? &quot;green&quot; : &quot;red&quot;);
  if (S.lat.length &gt; 20) {
    const s = [...S.lat].sort((a, b) =&gt; a - b);
    $(&quot;s-lat&quot;).textContent = (s[Math.floor(s.length * 0.95)] / 1000).toFixed(2) + &quot; s&quot;;
  }
  $(&quot;conv&quot;).innerHTML = `purchases &lt;span class=&quot;green&quot;&gt;${S.buyO}&lt;/span&gt; &lt;span class=&quot;dim&quot;&gt;vs&lt;/span&gt; &lt;span class=&quot;red&quot;&gt;${S.buyB}&lt;/span&gt;`;
}

// ------------------------------------------------------------------ feed (a sample of the shoppers)
function userCard(u) {
  const el = document.createElement(&quot;div&quot;);
  el.className = &quot;user&quot;;
  const views = u.recent.length ? &quot;viewed: &quot; + u.recent.map(p =&gt; p.name).join(&quot; · &quot;) : &quot;no recent views&quot;;
  el.innerHTML = `
    &lt;div class=&quot;row1&quot;&gt;&lt;span class=&quot;uid&quot;&gt;${u.user_id}&lt;/span&gt;&lt;span class=&quot;ts&quot;&gt;${u.ts.slice(11, 23)}Z&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;row2&quot;&gt;
      ${u.is_new_user ? &#x27;&lt;span class=&quot;badge new&quot;&gt;new · cold start&lt;/span&gt;&#x27; : &#x27;&lt;span class=&quot;badge&quot;&gt;returning&lt;/span&gt;&#x27;}
      &lt;span class=&quot;badge&quot;&gt;${u.device}&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;${u.page}&lt;/span&gt;
      &lt;span class=&quot;tag&quot;&gt;${u.region}&lt;/span&gt;
      &lt;span class=&quot;outcome&quot;&gt;…&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;views&quot;&gt;${views}&lt;/div&gt;`;
  el.style.transform = `translateY(${-ROW}px)`;
  el.style.opacity = 0;
  return el;
}

function layoutFeed() {
  users.forEach((u, i) =&gt; {
    const el = nodes.get(u.request_id);
    el.classList.toggle(&quot;current&quot;, i === 0);
    el.style.transform = `translateY(${12 + i * ROW}px)`;
    el.style.opacity = Math.max(0, 1 - i * 0.14);
    el.style.filter = i &gt; 3 ? `blur(${(i - 3) * 0.4}px)` : &quot;none&quot;;
  });
}

function showRecs(u) {
  const box = $(&quot;recs&quot;);
  [...box.children].forEach(c =&gt; { c.classList.remove(&quot;in&quot;); c.classList.add(&quot;out&quot;); });
  const maxS = Math.max(...u.recs.map(r =&gt; r.a));
  setTimeout(() =&gt; {
    box.innerHTML = &quot;&quot;;
    u.recs.forEach((c, k) =&gt; {
      const p = c.p, el = document.createElement(&quot;div&quot;);
      el.className = &quot;rec&quot;; el.dataset.id = p.id;
      const src = c.explore ? &#x27;&lt;span class=&quot;src explore&quot;&gt;explore&lt;/span&gt;&#x27; : `&lt;span class=&quot;src ${c.src}&quot;&gt;${c.src}&lt;/span&gt;`;
      el.innerHTML = `
        &lt;span class=&quot;rank&quot;&gt;${String(k + 1).padStart(2, &quot;0&quot;)}&lt;/span&gt;
        &lt;div style=&quot;min-width:0&quot;&gt;&lt;div class=&quot;name&quot;&gt;${p.name}&lt;/div&gt;&lt;div class=&quot;pid&quot;&gt;${p.id}&lt;/div&gt;&lt;/div&gt;
        ${src}
        &lt;span class=&quot;tag&quot;&gt;[${p.cat}]&lt;/span&gt;
        &lt;span class=&quot;price&quot;&gt;${p.price.toFixed(2)} €&lt;/span&gt;
        &lt;div class=&quot;sbar&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;`;
      box.appendChild(el);
      setTimeout(() =&gt; { el.classList.add(&quot;in&quot;); el.querySelector(&quot;.sbar i&quot;).style.width = (100 * c.a / maxS).toFixed(0) + &quot;%&quot;; }, 55 * k);
    });
  }, 260);
  currentRid = u.request_id;
  $(&quot;who&quot;).textContent = &quot;→ &quot; + u.user_id;
  $(&quot;lat&quot;).innerHTML = `answered in &lt;span class=&quot;${u.latency &lt; 1500 ? &quot;green&quot; : &quot;red&quot;}&quot;&gt;${u.latency} ms&lt;/span&gt;`;
  $(&quot;pp&quot;).innerHTML = `P(buy) &lt;span class=&quot;green&quot;&gt;${(100 * u.pOurs).toFixed(1)}%&lt;/span&gt; &lt;span class=&quot;dim&quot;&gt;vs&lt;/span&gt; &lt;span class=&quot;red&quot;&gt;${(100 * u.pBase).toFixed(1)}%&lt;/span&gt;`;
}

function showOutcome(u) {   // feedback arrives a bit after the answer, like team_28.feedback
  const el = nodes.get(u.request_id);
  if (!el) return;
  const o = el.querySelector(&quot;.outcome&quot;);
  if (u.boughtOurs) {
    o.textContent = &quot;+&quot; + fmtEur(u.boughtOurs.price); o.classList.add(&quot;buy&quot;);
    const row = document.querySelector(`.rec[data-id=&quot;${u.boughtOurs.id}&quot;]`);
    if (row &amp;&amp; currentRid === u.request_id) row.classList.add(&quot;bought&quot;);
  } else o.textContent = &quot;no purchase&quot;;
}

function show(u) {
  const el = userCard(u);
  $(&quot;feed&quot;).appendChild(el);
  nodes.set(u.request_id, el);
  users.unshift(u);
  while (users.length &gt; VISIBLE) {
    const old = users.pop(), n = nodes.get(old.request_id);
    nodes.delete(old.request_id); n.style.opacity = 0; setTimeout(() =&gt; n.remove(), 800);
  }
  requestAnimationFrame(() =&gt; requestAnimationFrame(layoutFeed));
  showRecs(u);
  setTimeout(() =&gt; showOutcome(u), OUTCOME_MS);
  $(&quot;sample&quot;).textContent = sinceShow &gt; 1 ? `1 of every ${sinceShow} · buyers more often` : &quot;every shopper&quot;;
  sinceShow = 0;
}

// ------------------------------------------------------------------ loop
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  acc += dt * PARAMS.users_per_sec * speed;
  let k = 0; while (acc &gt;= 1 &amp;&amp; k &lt; 3000) { consume(); acc -= 1; k++; }
  if (speed &gt; 0 &amp;&amp; latest &amp;&amp; now - lastShow &gt; (speed &gt; 1 ? 2800 : SHOW_MS)) {
    lastShow = now;
    // purchases are rare (~2 %): every other card, show the latest shopper who bought, if any since the last card
    const u = nShown++ % 2 === 1 &amp;&amp; lastBuyer ? lastBuyer : latest;
    lastBuyer = null;
    show(u);
  }
  render();
  requestAnimationFrame(loop);
}
document.querySelectorAll(&quot;#speed button&quot;).forEach(b =&gt; b.onclick = () =&gt; {
  speed = +b.dataset.x;
  document.querySelectorAll(&quot;#speed button&quot;).forEach(x =&gt; x.classList.toggle(&quot;on&quot;, x === b));
  $(&quot;status&quot;).classList.toggle(&quot;paused&quot;, speed === 0);
  $(&quot;status&quot;).textContent = `[ shop.requests → team_28.submissions ] ${speed === 0 ? &quot;paused&quot; : &quot;streaming&quot;}`;
});
speed = 10;
document.querySelector(&#x27;#speed button[data-x=&quot;10&quot;]&#x27;).classList.add(&quot;on&quot;);
for (let i = 0; i &lt; 4; i++) { consume(); show(latest); }
new ResizeObserver(render).observe(document.body);
requestAnimationFrame(loop);

<script>
const frames = [...document.querySelectorAll("iframe")];
function fit(f) { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) { f.style.height = "1400px"; } }
frames.forEach(f => { f.addEventListener("load", () => fit(f)); setInterval(() => fit(f), 1000); });
document.querySelectorAll('[role="tab"]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[role="tab"]').forEach(x => x.setAttribute("aria-selected", x === b));
  frames.forEach(f => { f.style.display = f.dataset.i === b.dataset.i ? "" : "none"; if (f.dataset.i === b.dataset.i) fit(f); });
});
</script>
